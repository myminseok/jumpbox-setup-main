[ ca ]
default_ca = CA_default

[ CA_default ]
dir               = ./certs
database          = $dir/root_index.txt
new_certs_dir     = $dir/.
serial            = $dir/root_ca_serial
private_key       = $dir/root_ca_key.pem
certificate       = $dir/root_ca_cert.pem
default_days      = 3650
default_md        = sha256
policy            = policy_strict
x509_extensions   = v3_ca

[ policy_strict ]
#countryName             = match
#stateOrProvinceName     = match
#organizationName        = match
commonName              = supplied

[ req ]
distinguished_name = req_distinguished_name
x509_extensions = v3_ca
prompt = no

[ req_distinguished_name ]
C = KO
ST = Seoul
L = Seoul
O = ExampleOrg
OU = RootCA
CN = ExampleOrg Root CA #<--- EDIT this


[ v3_ca ]
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid:always,issuer
basicConstraints = critical, CA:TRUE, pathlen:1
keyUsage = critical, digitalSignature, cRLSign, keyCertSign

[v3_intermediate_ca]
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid:always,issuer
basicConstraints = critical, CA:TRUE, pathlen:0
keyUsage = critical, cRLSign, keyCertSign, digitalSignature